version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mirov_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mirov_db}
      MYSQL_USER: ${MYSQL_USER:-mirov_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mirov_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mirov_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: mysql://${MYSQL_USER:-mirov_user}:${MYSQL_PASSWORD:-mirov_password}@db:3306/${MYSQL_DATABASE:-mirov_db}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_jwt_secret_key_12345}
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirov_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
